<body>

<div class="container">
    <h1>Finding the Normal Line & Refraction</h1>
    
    <div class="notebook-panel" id="instructions">
        Loading simulation...
    </div>
    
    <div class="canvas-container">
        <canvas id="simCanvas" width="600" height="350"></canvas>

</div>

<!-- Custom Confirmation Modal -->
<div id="modalOverlay">
    <div class="modal-content">
        <h2>Submit Final Score?</h2>

        <div class="modal-buttons">
            <button id="modalCancelBtn">Cancel</button>
            <button id="modalSubmitBtn">Yes, Submit</button>
        </div>
    </div>
</div>

<script>
    // --- 1. PLATFORM INTEGRATION (postMessage Protocol) ---
    let handshakeToken = null;
    let assignmentId = null;
    let parentOrigin = '*'; 

    window.addEventListener('message', (ev) => {
        try {
            const msg = ev.data;
            if (msg && msg.type === 'handshake' && msg.assignmentId && msg.token) {
                assignmentId = msg.assignmentId;
                handshakeToken = msg.token;
                parentOrigin = ev.origin;
                
                window.parent.postMessage({
                    type: 'sim-ready',
                    assignmentId,
                    token: handshakeToken,
                    payload: { version: '4.1', simId: 'lens-normal-sim' }
                }, parentOrigin);
            }
        } catch (err) {
            console.error("Error processing handshake:", err);
        }
    });

    let progressTimeout;
    function reportProgress(state) {
        if (!handshakeToken || !assignmentId) return;
        clearTimeout(progressTimeout);
        progressTimeout = setTimeout(() => {
            window.parent.postMessage({
                type: 'sim-progress',
                assignmentId,
                token: handshakeToken,
                payload: { timestamp: Date.now(), state }
            }, parentOrigin);
        }, 300);
    }

    function reportComplete(finalState) {
        if (!handshakeToken || !assignmentId) return;
        window.parent.postMessage({
            type: 'sim-complete',
            assignmentId,
            token: handshakeToken,
            payload: { finalState, score: finalState.score }
        }, parentOrigin);
    }


    // --- 2. SIMULATION DATA & RANDOM GENERATORS ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const instructionsEl = document.getElementById('instructions');
    const feedbackEl = document.getElementById('feedback');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const quizPanel = document.getElementById('quizPanel');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptionsContainer = document.getElementById('quizOptions');

    let phaseIndex = 0; 
    let currentPhase = null;
    let isDrawing = false;
    let drawStartX = 0, drawStartY = 0;
    let currentX = 0, currentY = 0;
    let userDrawnLine = null; 
    let showTrueNormal = false;
    let isSubmitted = false;
    let quizAnsweredCorrectly = false;
    
    let totalAttempts = 0;
    let totalAccuracy = 0; 
    let currentScore = 0;

    // Helper: generate random polygon for the final challenges
    function generateRandomPolygon() {
        const cx = 300, cy = 175;
        const radius = 90;
        const points = [];
        const numSides = 4 + Math.floor(Math.random() * 3); // 4 to 6 sides
        for (let i = 0; i < numSides; i++) {
            const angle = (i / numSides) * Math.PI * 2;
            const r = radius * (0.6 + Math.random() * 0.6); // Irregularity
            points.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
        }
        
        const edgeIdx = Math.floor(Math.random() * numSides);
        const p1 = points[edgeIdx];
        const p2 = points[(edgeIdx + 1) % numSides];
        
        const incX = (p1.x + p2.x) / 2;
        const incY = (p1.y + p2.y) / 2;
        
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let normalAngle = Math.atan2(dy, dx) - Math.PI/2; 
        
        let offset = (Math.random() * 0.8 + 0.3) * (Math.random() > 0.5 ? 1 : -1); 
        let lightFromAngle = normalAngle + offset;
        
        const startX = incX + Math.cos(lightFromAngle) * 150;
        const startY = incY + Math.sin(lightFromAngle) * 150;
        
        return {
            lens: { type: 'polygon', points: points },
            ray: { startX, startY, endX: incX, endY: incY },
            correctAngle: normalAngle
        };
    }

    const buildPhases = () => [
        () => ({
            mode: 'learn',
            text: "<b>LEARN 1: What is 'Perpendicular'?</b><br>Before we look at lenses, let's learn the word <span class='highlight'>Perpendicular</span>. It means two lines that meet at exactly 90 degrees (a perfect square corner).<br><br>👉 Notice the <span style='color:#ec4899; font-weight:bold;'>pink dashed line</span> highlighting the surface. <b>Click the red dot</b> to draw a line perfectly perpendicular (90°) to it.",
            lens: { type: 'line', x1: 150, y1: 200, x2: 450, y2: 200 },
            incPoint: { x: 300, y: 200 },
            correctAngle: -Math.PI / 2,
            showHighlight: true
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 1: Drawing Perpendicular</b><br>Now it's your turn. <br><br>👉 <b>Click and drag ANYWHERE</b> to draw a line perfectly perpendicular (90°) to the pink surface. Make sure it passes precisely through the red dot!",
            lens: { type: 'line', x1: 150, y1: 200, x2: 450, y2: 200 },
            incPoint: { x: 300, y: 200 },
            correctAngle: -Math.PI / 2,
            showHighlight: true
        }),
        () => ({
            mode: 'quiz',
            text: "<b>Pop Quiz!</b>",
            question: "What angle does a 'Perpendicular' line make with the surface?",
            options: ["0 degrees (Parallel to it)", "45 degrees", "90 degrees (A square corner)", "180 degrees"],
            correctIndex: 2
        }),
        () => ({
            mode: 'notes',
            text: "<b>Applying this to Lenses & Light.</b><br><br>When light enters a lens, it bends. To measure the bend, we draw the <span class='highlight'>Normal Line</span>.<br><br><b>The Rules:</b><br>1. The Normal Line is exactly <b>perpendicular (90°)</b> to the lens surface at the exact spot the light hits.<br>2. It must cross the boundary, extending into BOTH the air and the lens.<br>3. Light bends <b>towards</b> the normal entering the lens, and <b>away</b> exiting.",
            lens: null, ray: null
        }),
        () => ({
            mode: 'learn',
            text: "<b>LEARN 2: Flat Lens</b><br>The pink line shows the surface the light is hitting.<br><br>👉 <b>Click the red dot</b> to reveal the Normal Line. Notice how it extends across the boundary into the lens, and how the light inside bends <b>towards</b> it.",
            lens: { type: 'rect', x: 250, y: 50, w: 100, h: 250 },
            ray: { startX: 100, startY: 50, endX: 250, endY: 175 },
            correctAngle: Math.PI,
            showHighlight: true
        }),
        () => ({
            mode: 'quiz',
            text: "<b>Pop Quiz!</b>",
            question: "Where exactly MUST the Normal Line be drawn?",
            options: ["At the exact center of the lens", "At the Point of Incidence (the red dot where light hits)", "Parallel to the incoming light ray", "It doesn't matter as long as it's 90 degrees"],
            correctIndex: 1
        }),
        () => ({
            mode: 'learn',
            text: "<b>LEARN 3: Circular Lenses</b><br>Finding 90° on a curve is tricky! <br><br><b>The Trick:</b> The Normal Line on a circle always lines up with the radius. It points straight away from the <span class='highlight'>center of the circle</span>.<br><br>👉 <b>Click the red dot</b> to reveal the Normal Line. Notice the pink tangent surface!",
            lens: { type: 'circle', x: 300, y: 175, r: 100 },
            ray: { startX: 100, startY: 50, endX: 215, endY: 122 },
            correctAngle: Math.atan2(122 - 175, 215 - 300),
            showHighlight: true
        }),
        () => ({
            mode: 'quiz',
            text: "<b>Pop Quiz!</b>",
            question: "On a circular lens, the Normal Line always aligns with what?",
            options: ["The path of the incoming light", "The top edge of the circle", "The center of the circle (the radius)", "The bottom edge of the circle"],
            correctIndex: 2
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 2: Flat Lens</b><br>Your turn. The pink surface is highlighted to help you.<br><br>👉 <b>Click and drag ANYWHERE</b> to draw the Normal Line 90° to the surface.",
            lens: { type: 'rect', x: 150, y: 75, w: 150, h: 200 },
            ray: { startX: 500, startY: 50, endX: 300, endY: 150 },
            correctAngle: 0,
            showHighlight: true
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 3: Triangular Prism</b><br>The pink highlight is gone! You must find the surface yourself.<br><br>👉 <b>Click and drag to draw the Normal Line.</b> Remember: 90 degrees to the slanted surface!",
            lens: { type: 'polygon', points: [{x:200, y:250}, {x:400, y:250}, {x:300, y:75}] },
            ray: { startX: 100, startY: 100, endX: 250, endY: 162.5 },
            correctAngle: Math.atan2(75-250, 300-200) - Math.PI/2,
            showHighlight: false
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 4: Circular Lens</b><br>Use the blue center dot to help you aim!<br><br>👉 <b>Click and drag to draw the Normal Line.</b>",
            lens: { type: 'circle', x: 200, y: 175, r: 100 },
            ray: { startX: 450, startY: 50, endX: 270, endY: 104 },
            correctAngle: Math.atan2(104 - 175, 270 - 200),
            showHighlight: false
        }),
        () => {
            const phase = generateRandomPolygon();
            phase.mode = 'practice';
            phase.text = "<b>PRACTICE 5: Random Shape</b><br>Let's test your skills on a strange shape. Look closely at the edge where the light hits.<br><br>👉 <b>Draw the Normal Line.</b> (90° to the surface)";
            phase.showHighlight = false;
            return phase;
        },
        () => {
            const phase = generateRandomPolygon();
            phase.mode = 'practice';
            phase.text = "<b>PRACTICE 6: Final Random Challenge</b><br>One last unusual shape. You can do this!<br><br>👉 <b>Draw the Normal Line.</b>";
            phase.showHighlight = false;
            return phase;
        },
        () => ({
            mode: 'complete',
            text: "<b>Simulation Complete!</b><br>You've successfully finished all the practice rounds. Let's see how you did!",
            lens: null, ray: null
        })
    ];

    let phasesConfig = [];

    // --- 3. GRAPHICS & MATH ---
    function initPhase() {
        if (phasesConfig.length === 0) {
            phasesConfig = buildPhases().map(fn => fn());
        }
        
        currentPhase = phasesConfig[phaseIndex];
        instructionsEl.innerHTML = currentPhase.text;
        
        userDrawnLine = null;
        isDrawing = false;
        showTrueNormal = false;
        quizAnsweredCorrectly = false;
        feedbackEl.innerText = "";
        
        // UI Management based on mode
        if (currentPhase.mode === 'quiz') {
            document.getElementById('simCanvas').style.display = 'none';
            quizPanel.style.display = 'flex';
            setupQuiz(currentPhase);
            prevBtn.style.display = 'none';
            nextBtn.style.display = 'block';
            nextBtn.disabled = true;
            restartBtn.style.display = 'none';
            feedbackEl.innerText = "Answer the question to continue.";
            feedbackEl.style.color = "#64748b";
        } 
        else if (currentPhase.mode === 'complete') {
            document.getElementById('simCanvas').style.display = 'block';
            quizPanel.style.display = 'none';
            
            const finalScore = totalAttempts === 0 ? 0 : Math.round(totalAccuracy / totalAttempts);
            
            prevBtn.style.display = 'none';
            restartBtn.style.display = 'block';

            if (isSubmitted) {
                feedbackEl.style.color = "#10b981";
                feedbackEl.innerText = `Score of ${finalScore}% submitted successfully!`;
                nextBtn.style.display = 'none';
            } else if (finalScore >= 80) {
                feedbackEl.style.color = "#10b981";
                feedbackEl.innerText = `Great effort! Final Average Accuracy: ${finalScore}%. You have passed the 80% threshold!`;
                nextBtn.innerText = "Submit Score";
                nextBtn.disabled = false;
                nextBtn.style.display = 'block';
            } else {
                feedbackEl.style.color = "#ef4444";
                feedbackEl.innerText = `Your average score is ${finalScore}%. You need at least 80% to submit. Please click Restart Practice to try again.`;
                nextBtn.style.display = 'none';
            }
        } 
        else {
            document.getElementById('simCanvas').style.display = 'block';
            quizPanel.style.display = 'none';
            
            prevBtn.style.display = 'block';
            restartBtn.style.display = 'none';
            nextBtn.style.display = 'block';
            nextBtn.innerText = "Next";
            nextBtn.disabled = true;
            prevBtn.disabled = phaseIndex === 0;

            if (currentPhase.mode === 'notes') {
                nextBtn.disabled = false;
            } else {
                reportProgress({ currentPhase: phaseIndex, status: 'started' });
            }
            draw();
        }
    }

    function setupQuiz(phase) {
        quizQuestion.innerText = phase.question;
        quizOptionsContainer.innerHTML = '';
        
        phase.options.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'quiz-option';
            btn.innerText = opt;
            btn.onclick = () => handleQuizAnswer(idx, phase.correctIndex, btn);
            quizOptionsContainer.appendChild(btn);
        });
    }

    function handleQuizAnswer(selectedIndex, correctIndex, btnElement) {
        if (quizAnsweredCorrectly) return; // Prevent clicking after right answer
        
        const allBtns = document.querySelectorAll('.quiz-option');
        allBtns.forEach(b => b.classList.remove('correct', 'incorrect'));

        if (selectedIndex === correctIndex) {
            btnElement.classList.add('correct');
            feedbackEl.innerText = "Correct! Click Next to continue.";
            feedbackEl.style.color = "#10b981";
            quizAnsweredCorrectly = true;
            nextBtn.disabled = false;
        } else {
            btnElement.classList.add('incorrect');
            feedbackEl.innerText = "Incorrect! Restarting tutorial to make sure you read the rules...";
            feedbackEl.style.color = "#ef4444";
            
            // Force restart on wrong answer after short delay
            setTimeout(() => {
                phaseIndex = 0; // Back to beginning
                initPhase();
            }, 2500);
        }
    }

    // -- Math Helpers for Refraction & Tracing --
    function getRefractedAngleGen(n1, n2, rayTravelAngle, normalAngleIntoMedium1) {
        let fromIncAngle = rayTravelAngle + Math.PI; 
        let theta1 = fromIncAngle - normalAngleIntoMedium1;
        while (theta1 > Math.PI) theta1 -= Math.PI * 2;
        while (theta1 < -Math.PI) theta1 += Math.PI * 2;

        const sinTheta2 = (n1 / n2) * Math.sin(theta1);
        if (Math.abs(sinTheta2) > 1) return normalAngleIntoMedium1 - theta1; // TIR
        
        const theta2 = Math.asin(sinTheta2);
        return normalAngleIntoMedium1 + Math.PI + theta2;
    }

    function findExitPoint(lens, entryPt, travelAngle) {
        const dir = { x: Math.cos(travelAngle), y: Math.sin(travelAngle) };
        let closest = null;

        if (lens.type === 'circle') {
            const ocX = entryPt.x - lens.x;
            const ocY = entryPt.y - lens.y;
            const a = 1;
            const b = 2 * (ocX * dir.x + ocY * dir.y);
            const c = ocX * ocX + ocY * ocY - lens.r * lens.r;
            const disc = b * b - 4 * a * c;
            if (disc > 0) {
                const t1 = (-b - Math.sqrt(disc)) / 2;
                const t2 = (-b + Math.sqrt(disc)) / 2;
                const t = t1 > 0.05 ? t1 : (t2 > 0.05 ? t2 : -1);
                if (t > 0) {
                    const hitX = entryPt.x + dir.x * t;
                    const hitY = entryPt.y + dir.y * t;
                    closest = { x: hitX, y: hitY, normal: Math.atan2(hitY - lens.y, hitX - lens.x) };
                }
            }
        } else {
            let pts = [];
            if (lens.type === 'rect') {
                pts = [ {x: lens.x, y: lens.y}, {x: lens.x + lens.w, y: lens.y}, {x: lens.x + lens.w, y: lens.y + lens.h}, {x: lens.x, y: lens.y + lens.h} ];
            } else if (lens.type === 'polygon') {
                pts = lens.points;
            }

            for(let i=0; i<pts.length; i++) {
                const p1 = pts[i];
                const p2 = pts[(i+1)%pts.length];
                const v1 = entryPt.x - p1.x;
                const v2 = entryPt.y - p1.y;
                const v3 = p2.x - p1.x;
                const v4 = p2.y - p1.y;
                const cross = dir.x * v4 - dir.y * v3;
                if (Math.abs(cross) < 0.001) continue;

                const t1 = (v3 * v2 - v4 * v1) / cross;
                const t2 = (dir.x * v2 - dir.y * v1) / cross;

                if (t1 > 0.05 && t2 >= 0 && t2 <= 1) {
                    if (!closest || t1 < closest.t) {
                        closest = { x: entryPt.x + dir.x * t1, y: entryPt.y + dir.y * t1, t: t1, normal: Math.atan2(p2.y - p1.y, p2.x - p1.x) - Math.PI/2 };
                    }
                }
            }
        }
        return closest;
    }

    // -- Drawing Functions --
    function buildLensPath(lens) {
        ctx.beginPath();
        if (lens.type === 'line') {
            ctx.moveTo(lens.x1, lens.y1);
            ctx.lineTo(lens.x2, lens.y2);
        } else if (lens.type === 'rect') {
            ctx.rect(lens.x, lens.y, lens.w, lens.h);
        } else if (lens.type === 'circle') {
            ctx.arc(lens.x, lens.y, lens.r, 0, Math.PI * 2);
        } else if (lens.type === 'polygon') {
            ctx.moveTo(lens.points[0].x, lens.points[0].y);
            for (let i = 1; i < lens.points.length; i++) ctx.lineTo(lens.points[i].x, lens.points[i].y);
            ctx.closePath();
        }
    }

    function drawSurfaceHighlight(inc, correctAngle) {
        ctx.strokeStyle = "#ec4899"; // Pink highlight
        ctx.lineWidth = 5;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        
        // The surface is exactly perpendicular to the correct normal line!
        const surfaceAngle = correctAngle + Math.PI/2;
        const length = 50; 
        
        ctx.moveTo(inc.x - Math.cos(surfaceAngle)*length, inc.y - Math.sin(surfaceAngle)*length);
        ctx.lineTo(inc.x + Math.cos(surfaceAngle)*length, inc.y + Math.sin(surfaceAngle)*length);
        
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
        const headlen = 12; 
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.lineTo(toX, toY);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawRightAngle(x, y, angle) {
        const size = 15;
        const surfaceAngle = angle + Math.PI / 2;
        
        const nx = x + Math.cos(angle) * size;
        const ny = y + Math.sin(angle) * size;
        const sx = x + Math.cos(surfaceAngle) * size;
        const sy = y + Math.sin(surfaceAngle) * size;
        const cx = nx + Math.cos(surfaceAngle) * size;
        const cy = ny + Math.sin(surfaceAngle) * size;
        
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = "rgba(16, 185, 129, 0.9)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawNormalLine(x, y, angle, color, label) {
        const length = 200; 
        const x1 = x + Math.cos(angle) * length;
        const y1 = y + Math.sin(angle) * length;
        const x2 = x - Math.cos(angle) * length;
        const y2 = y - Math.sin(angle) * length;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        ctx.stroke();
        ctx.setLineDash([]); 

        if (label) {
            ctx.fillStyle = color;
            ctx.font = "bold 14px Arial";
            ctx.fillText(label, x + Math.cos(angle)*80, y + Math.sin(angle)*80 - 5);
        }
    }

    function draw() {
        if (currentPhase.mode === 'quiz' || (currentPhase.mode === 'complete' && !currentPhase.lens)) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const p = currentPhase;
        const inc = p.incPoint ? { x: p.incPoint.x, y: p.incPoint.y } : (p.ray ? { x: p.ray.endX, y: p.ray.endY } : null);

        // 1. Draw Lens or Line Surface
        if (p.lens.type === 'line') {
            ctx.strokeStyle = "#1e293b"; 
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            buildLensPath(p.lens);
            ctx.stroke();
            ctx.lineCap = 'butt'; 
        } else {
            ctx.fillStyle = "rgba(56, 189, 248, 0.2)"; 
            ctx.strokeStyle = "#0284c7";
            ctx.lineWidth = 3;
            buildLensPath(p.lens);
            ctx.fill();
            ctx.stroke();
        }

        // Draw Circle Center
        if (p.lens.type === 'circle') {
            ctx.beginPath();
            ctx.fillStyle = "#0369a1";
            ctx.arc(p.lens.x, p.lens.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillText("Center", p.lens.x - 18, p.lens.y + 18);
        }

        // Highlight active surface area if enabled
        if (p.showHighlight && inc) {
            drawSurfaceHighlight(inc, p.correctAngle);
        }

        // 2 & 3. Draw Rays (Incident, Interior, Exit)
        if (p.ray) {
            drawArrow(p.ray.startX, p.ray.startY, p.ray.endX, p.ray.endY, "#eab308"); 
            
            if (inc && showTrueNormal) {
                const n1 = 1.0, n2 = 1.5;
                const entryTravelAngle = Math.atan2(p.ray.endY - p.ray.startY, p.ray.endX - p.ray.startX);
                const interiorAngle = getRefractedAngleGen(n1, n2, entryTravelAngle, p.correctAngle);
                const exitHit = findExitPoint(p.lens, inc, interiorAngle);
                
                if (exitHit) {
                    drawArrow(inc.x, inc.y, exitHit.x, exitHit.y, "#d97706"); // Inside
                    const normalIntoLens = exitHit.normal + Math.PI;
                    const exitAngle = getRefractedAngleGen(n2, n1, interiorAngle, normalIntoLens);
                    
                    const exitLen = 120;
                    drawArrow(exitHit.x, exitHit.y, exitHit.x + Math.cos(exitAngle) * exitLen, exitHit.y + Math.sin(exitAngle) * exitLen, "#fbbf24"); // Outside
                } else {
                    const refLen = 200;
                    ctx.save();
                    buildLensPath(p.lens);
                    ctx.clip();
                    drawArrow(inc.x, inc.y, inc.x + Math.cos(interiorAngle) * refLen, inc.y + Math.sin(interiorAngle) * refLen, "#d97706"); 
                    ctx.restore();
                }
            }
        }

        // 4. Draw True Normal & Right Angle indicator
        if (showTrueNormal) {
            drawNormalLine(inc.x, inc.y, p.correctAngle, "rgba(16, 185, 129, 0.6)", p.mode === 'learn' ? "Normal Line" : "True Normal");
            drawRightAngle(inc.x, inc.y, p.correctAngle);
        }

        // 5. Draw User's Line (Matches exactly where they drew it)
        if (p.mode === 'practice') {
            if (isDrawing) {
                ctx.beginPath();
                ctx.moveTo(drawStartX, drawStartY);
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if (userDrawnLine) {
                const dx = userDrawnLine.x2 - userDrawnLine.x1;
                const dy = userDrawnLine.y2 - userDrawnLine.y1;
                const angle = Math.atan2(dy, dx);
                
                // Draw exactly the segment the user made, but extend it forward and backwards so it crosses limits
                const midX = (userDrawnLine.x1 + userDrawnLine.x2) / 2;
                const midY = (userDrawnLine.y1 + userDrawnLine.y2) / 2;

                ctx.beginPath();
                ctx.moveTo(midX + Math.cos(angle)*200, midY + Math.sin(angle)*200);
                ctx.lineTo(midX - Math.cos(angle)*200, midY - Math.sin(angle)*200);
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // 6. Draw Point of Incidence (on top)
        if (inc) {
            ctx.beginPath();
            ctx.arc(inc.x, inc.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#ef4444"; 
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    // --- 4. INTERACTION HANDLING ---
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let cx = evt.clientX;
        let cy = evt.clientY;

        if (evt.touches && evt.touches.length > 0) {
            cx = evt.touches[0].clientX;
            cy = evt.touches[0].clientY;
        }
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function handleStart(e) {
        if (!currentPhase) return;
        if (currentPhase.mode === 'notes' || currentPhase.mode === 'complete' || currentPhase.mode === 'quiz') return;
        
        e.preventDefault();
        const pos = getMousePos(e);

        if (currentPhase.mode === 'learn') {
            showTrueNormal = true;
            nextBtn.disabled = false;
            draw();
        } 
        else if (currentPhase.mode === 'practice' && nextBtn.disabled) {
            isDrawing = true;
            drawStartX = pos.x;
            drawStartY = pos.y;
            currentX = pos.x;
            currentY = pos.y;
            userDrawnLine = null; // Clear old line to remove confusion
            feedbackEl.innerText = "Dragging line... (Notice it stays exactly where you draw it!)";
            feedbackEl.style.color = "#64748b";
            draw();
        }
    }

    function handleMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;
        draw();
    }

    function handleEnd(e) {
        if (!isDrawing) return;
        e.preventDefault();
        isDrawing = false;
        
        const lineLen = Math.hypot(currentX - drawStartX, currentY - drawStartY);
        if (lineLen < 10) {
            feedbackEl.innerText = "Please drag your mouse outward to draw a line segment.";
            feedbackEl.style.color = "#ef4444";
            draw();
            return;
        }

        userDrawnLine = { x1: drawStartX, y1: drawStartY, x2: currentX, y2: currentY };
        const inc = currentPhase.incPoint ? { x: currentPhase.incPoint.x, y: currentPhase.incPoint.y } : { x: currentPhase.ray.endX, y: currentPhase.ray.endY };
        
        // --- SCORING CONFIGURATION VARIABLES ---
        // Tweak these numbers to make the grading harder or easier!
        const MAX_DISTANCE_ERROR = 25;  // Pixels. Max allowed distance from the red dot (Middle ground: 25)
        const PERFECT_ANGLE_MARGIN = 3; // Degrees. Allowed wiggle room to still get exactly 100% (Middle ground: 3)
        const ANGLE_DROPOFF_RATE = 15;  // Degrees. How many degrees past the perfect margin until the score hits 0%
        // ---------------------------------------

        // Distance check from incidence point to the drawn line
        const A = currentY - drawStartY;
        const B = -(currentX - drawStartX);
        const C = currentX * drawStartY - drawStartX * currentY;
        const dist = Math.abs(A * inc.x + B * inc.y + C) / Math.hypot(A, B);

        let accuracy = 0;
        let isSuccess = false;

        if (dist > MAX_DISTANCE_ERROR) {
            feedbackEl.style.color = "#ef4444";
            feedbackEl.innerText = `Score 0%. Your line missed the red dot by ${Math.round(dist)}px! It MUST pass exactly through the Point of Incidence.`;
            accuracy = 0;
        } else {
            // Angle check
            const drawnAngle = Math.atan2(A, -B); 
            let angleDiff = Math.abs(drawnAngle - currentPhase.correctAngle);
            
            // Normalize
            angleDiff = angleDiff % Math.PI;
            if (angleDiff > Math.PI / 2) angleDiff = Math.PI - angleDiff;
            
            const diffDeg = angleDiff * 180 / Math.PI;
            
            // Smoother Scoring Math based on the variables above:
            if (diffDeg <= PERFECT_ANGLE_MARGIN) {
                accuracy = 100;
            } else {
                accuracy = Math.max(0, 100 - ((diffDeg - PERFECT_ANGLE_MARGIN) / ANGLE_DROPOFF_RATE) * 100);
            }
            
            accuracy = Math.round(accuracy);

            if (accuracy >= 85) {
                feedbackEl.style.color = "#10b981";
                if (currentPhase.ray) {
                    feedbackEl.innerText = `Awesome! ${accuracy}% accurate. Notice the 90° box and how the light bends!`;
                } else {
                    feedbackEl.innerText = `Awesome! ${accuracy}% accurate. You've drawn a perfect perpendicular (90°) right angle!`;
                }
                showTrueNormal = true;
                nextBtn.disabled = false;
                isSuccess = true;
            } else {
                feedbackEl.style.color = "#ef4444";
                feedbackEl.innerText = `Not quite right (${accuracy}%). You were off by ${Math.round(diffDeg)}°. Try again! (Needs 85%+)`;
            }
        }

        totalAttempts++;
        totalAccuracy += accuracy;
        currentScore = Math.round(totalAccuracy / totalAttempts);
        scoreDisplay.innerText = `Practice Score: ${currentScore}%`;

        reportProgress({ 
            currentPhase: phaseIndex, 
            accuracyThisAttempt: accuracy,
            averageScore: currentScore,
            status: isSuccess ? 'success' : 'retry'
        });

        draw();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd);

    // Navigation and Submission Logic
    nextBtn.addEventListener('click', () => {
        if (currentPhase.mode === 'complete') {
            document.getElementById('modalScoreDisplay').innerText = currentScore;
            document.getElementById('modalOverlay').style.display = 'flex';
        } else {
            phaseIndex++;
            initPhase();
        }
    });

    prevBtn.addEventListener('click', () => {
        phaseIndex = Math.max(0, phaseIndex - 1);
        initPhase();
    });

    restartBtn.addEventListener('click', () => {
        phasesConfig = [];
        phaseIndex = 0;
        totalAttempts = 0;
        totalAccuracy = 0;
        currentScore = 0;
        isSubmitted = false;
        scoreDisplay.innerText = `Practice Score: 0%`;
        initPhase();
    });

    // Modal Events
    document.getElementById('modalCancelBtn').addEventListener('click', () => {
        document.getElementById('modalOverlay').style.display = 'none';
    });

    document.getElementById('modalSubmitBtn').addEventListener('click', () => {
        document.getElementById('modalOverlay').style.display = 'none';
        isSubmitted = true;
        reportComplete({ phase: 'complete', score: currentScore });
        initPhase(); 
    });

    // Start Simulation
    initPhase();

</script>
</body>
