<body>

<div class="container">

<script>
    // --- 1. PLATFORM INTEGRATION (postMessage Protocol) ---
    let handshakeToken = null;
    let assignmentId = null;
    let parentOrigin = '*'; 

    window.addEventListener('message', (ev) => {
        try {
            const msg = ev.data;
            if (msg && msg.type === 'handshake' && msg.assignmentId && msg.token) {
                assignmentId = msg.assignmentId;
                handshakeToken = msg.token;
                parentOrigin = ev.origin;
                
                window.parent.postMessage({
                    type: 'sim-ready',
                    assignmentId,
                    token: handshakeToken,
                    payload: { version: '3.0', simId: 'lens-normal-sim' }
                }, parentOrigin);
            }
        } catch (err) {
            console.error("Error processing handshake:", err);
        }
    });

    let progressTimeout;
    function reportProgress(state) {
        if (!handshakeToken || !assignmentId) return;
        clearTimeout(progressTimeout);
        progressTimeout = setTimeout(() => {
            window.parent.postMessage({
                type: 'sim-progress',
                assignmentId,
                token: handshakeToken,
                payload: { timestamp: Date.now(), state }
            }, parentOrigin);
        }, 300);
    }

    function reportComplete(finalState) {
        if (!handshakeToken || !assignmentId) return;
        window.parent.postMessage({
            type: 'sim-complete',
            assignmentId,
            token: handshakeToken,
            payload: { finalState, score: finalState.score }
        }, parentOrigin);
    }


    // --- 2. SIMULATION DATA & RANDOM GENERATORS ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const instructionsEl = document.getElementById('instructions');
    const feedbackEl = document.getElementById('feedback');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scoreDisplay = document.getElementById('scoreDisplay');

    let phaseIndex = 0; 
    let currentPhase = null;
    let isDrawing = false;
    let drawStartX = 0, drawStartY = 0;
    let currentX = 0, currentY = 0;
    let userDrawnLine = null; // {x1, y1, x2, y2}
    let showTrueNormal = false;
    let isSubmitted = false;
    
    let totalAttempts = 0;
    let totalAccuracy = 0; 
    let currentScore = 0;

    // Helper: generate random polygon for the final challenges
    function generateRandomPolygon() {
        const cx = 300, cy = 175;
        const radius = 90;
        const points = [];
        const numSides = 4 + Math.floor(Math.random() * 3); // 4 to 6 sides
        for (let i = 0; i < numSides; i++) {
            const angle = (i / numSides) * Math.PI * 2;
            const r = radius * (0.6 + Math.random() * 0.6); // Irregularity
            points.push({ x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r });
        }
        
        // Pick random edge
        const edgeIdx = Math.floor(Math.random() * numSides);
        const p1 = points[edgeIdx];
        const p2 = points[(edgeIdx + 1) % numSides];
        
        const incX = (p1.x + p2.x) / 2;
        const incY = (p1.y + p2.y) / 2;
        
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let normalAngle = Math.atan2(dy, dx) - Math.PI/2; 
        
        let offset = (Math.random() * 0.8 + 0.3) * (Math.random() > 0.5 ? 1 : -1); 
        let lightFromAngle = normalAngle + offset;
        
        const startX = incX + Math.cos(lightFromAngle) * 150;
        const startY = incY + Math.sin(lightFromAngle) * 150;
        
        return {
            lens: { type: 'polygon', points: points },
            ray: { startX, startY, endX: incX, endY: incY },
            correctAngle: normalAngle
        };
    }

    const buildPhases = () => [
        () => ({
            mode: 'learn',
            text: "<b>LEARN 1: What is 'Perpendicular'?</b><br>Before we talk about lenses and light, let's learn the word <span class='highlight'>Perpendicular</span>. It means two lines that meet at exactly 90 degrees (a perfect square corner).<br><br>👉 <b>Click the red dot</b> to draw a perfectly perpendicular line to the black surface below.",
            lens: { type: 'line', x1: 150, y1: 200, x2: 450, y2: 200 },
            incPoint: { x: 300, y: 200 },
            correctAngle: -Math.PI / 2
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 1: Perpendicular</b><br>Now it's your turn. <br><br>👉 <b>Click the red dot and drag UP</b> to draw a line that is perfectly perpendicular (90°) to the black line.",
            lens: { type: 'line', x1: 150, y1: 200, x2: 450, y2: 200 },
            incPoint: { x: 300, y: 200 },
            correctAngle: -Math.PI / 2
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 2: Angled Line</b><br>What if the surface is tilted?<br><br>👉 <b>Click the red dot and drag UP/AWAY</b> to draw the perpendicular line. It must still form a perfect 90° corner with the black line!",
            lens: { type: 'line', x1: 150, y1: 280, x2: 450, y2: 150 },
            incPoint: { x: 300, y: 215 },
            correctAngle: Math.atan2(150-280, 450-150) - Math.PI/2
        }),
        () => ({
            mode: 'notes',
            text: "<b>Great! Now let's apply this to Lenses & Light.</b><br><br>When light travels from air into a lens, it bends (refracts). To measure how much it bends, scientists draw an imaginary reference line called the <span class='highlight'>Normal Line</span>.<br><br><b>The Golden Rules:</b><br>1. The Normal Line is exactly perpendicular (90°) to the lens surface, right where the light hits it.<br>2. Watch how the light bends <b>towards</b> the normal when entering the lens, and <b>away</b> from it when exiting back into the air.",
            lens: null, ray: null
        }),
        () => ({
            mode: 'learn',
            text: "<b>LEARN 2: Flat Lens (Straight On)</b><br>Look at the yellow light ray hitting the flat lens. The red dot is the Point of Incidence.<br><br>👉 <b>Click anywhere</b> to reveal the Normal Line. Notice it makes a perfect 90° angle. Because the light is hitting <i>straight on</i> (along the normal), it doesn't bend!",
            lens: { type: 'rect', x: 250, y: 50, w: 100, h: 250 },
            ray: { startX: 50, startY: 175, endX: 250, endY: 175 },
            correctAngle: Math.PI 
        }),
        () => ({
            mode: 'learn',
            text: "<b>LEARN 3: Flat Lens (Angled)</b><br>Now the light is coming in at an angle. The normal is <b>NOT</b> the same as the light ray!<br><br>👉 <b>Click anywhere</b> to reveal the Normal Line. Notice how the light bends <b>towards</b> the normal inside, and <b>away</b> as it exits.",
            lens: { type: 'rect', x: 250, y: 50, w: 100, h: 250 },
            ray: { startX: 100, startY: 50, endX: 250, endY: 175 },
            correctAngle: Math.PI 
        }),
        () => ({
            mode: 'learn',
            text: "<b>LEARN 4: Circular Lenses</b><br>For curved surfaces, finding 90 degrees looks different! <br><br><b>The Trick:</b> The Normal Line on a circle always lines up with the radius. It points straight away from the <span class='highlight'>center of the circle</span>.<br><br>👉 <b>Click anywhere</b> to reveal the Normal Line.",
            lens: { type: 'circle', x: 300, y: 175, r: 100 },
            ray: { startX: 100, startY: 50, endX: 215, endY: 122 },
            correctAngle: Math.atan2(122 - 175, 215 - 300) 
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 3: Flat Lens</b><br>Now it's your turn. The light hits the <i>right</i> side.<br><br>👉 <b>Click and drag ANYWHERE</b> to draw the Normal Line. <br><span style='color:red;'>⚠️ It MUST pass exactly through the red dot (Point of Incidence) to get points!</span>",
            lens: { type: 'rect', x: 150, y: 75, w: 150, h: 200 },
            ray: { startX: 500, startY: 50, endX: 300, endY: 150 },
            correctAngle: 0 
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 4: Triangular Prism</b><br>The light is hitting the angled surface.<br><br>👉 <b>Click and drag to draw the Normal Line.</b> Remember: 90 degrees to the surface, passing exactly through the red dot!",
            lens: { type: 'polygon', points: [{x:200, y:250}, {x:400, y:250}, {x:300, y:75}] },
            ray: { startX: 100, startY: 100, endX: 250, endY: 162.5 },
            correctAngle: Math.atan2(75-250, 300-200) - Math.PI/2 // Normal to left edge
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 5: Trapezoid</b><br>The light is hitting the slanted edge on the top right.<br><br>👉 <b>Draw the Normal Line.</b>",
            lens: { type: 'polygon', points: [{x:150, y:250}, {x:450, y:250}, {x:350, y:100}, {x:250, y:100}] },
            ray: { startX: 550, startY: 100, endX: 400, endY: 175 },
            correctAngle: Math.atan2(100-250, 350-450) - Math.PI/2 
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 6: Circular Lens</b><br>The light hits the top-right edge. Use the blue center dot to help you aim!<br><br>👉 <b>Click and drag to draw the Normal Line.</b>",
            lens: { type: 'circle', x: 200, y: 175, r: 100 },
            ray: { startX: 450, startY: 50, endX: 270, endY: 104 },
            correctAngle: Math.atan2(104 - 175, 270 - 200) 
        }),
        () => ({
            mode: 'practice',
            text: "<b>PRACTICE 7: Circular Lens (Bottom)</b><br>The light is hitting the exact bottom edge of the circle.<br><br>👉 <b>Draw the Normal Line.</b>",
            lens: { type: 'circle', x: 300, y: 150, r: 100 },
            ray: { startX: 400, startY: 350, endX: 300, endY: 250 },
            correctAngle: Math.PI / 2 // Pointing straight down
        }),
        () => {
            const phase = generateRandomPolygon();
            phase.mode = 'practice';
            phase.text = "<b>PRACTICE 8: Random Shape</b><br>Let's test your skills on a strange shape. Look closely at the surface where the light hits.<br><br>👉 <b>Draw the Normal Line.</b> (90° to the surface, through the red dot)";
            return phase;
        },
        () => {
            const phase = generateRandomPolygon();
            phase.mode = 'practice';
            phase.text = "<b>PRACTICE 9: Final Random Challenge</b><br>One last unusual shape. You can do this!<br><br>👉 <b>Draw the Normal Line.</b>";
            return phase;
        },
        () => ({
            mode: 'complete',
            text: "<b>Simulation Complete!</b><br>You've successfully finished all the practice rounds. Let's see how you did!",
            lens: null, ray: null
        })
    ];

    let phasesConfig = [];

    // --- 3. GRAPHICS & MATH ---
    function initPhase() {
        if (phasesConfig.length === 0) {
            phasesConfig = buildPhases().map(fn => fn());
        }
        
        currentPhase = phasesConfig[phaseIndex];
        instructionsEl.innerHTML = currentPhase.text;
        
        userDrawnLine = null;
        isDrawing = false;
        showTrueNormal = false;
        feedbackEl.innerText = "";
        
        if (currentPhase.mode === 'complete') {
            const finalScore = totalAttempts === 0 ? 0 : Math.round(totalAccuracy / totalAttempts);
            
            // Manage UI visibility for final screen
            prevBtn.style.display = 'none';
            restartBtn.style.display = 'block';

            if (isSubmitted) {
                feedbackEl.style.color = "#10b981";
                feedbackEl.innerText = `Score of ${finalScore}% submitted successfully!`;
                nextBtn.style.display = 'none';
            } else if (finalScore >= 80) {
                feedbackEl.style.color = "#10b981";
                feedbackEl.innerText = `Great effort! Final Average Accuracy: ${finalScore}%. You have passed the 80% threshold!`;
                nextBtn.innerText = "Submit Score";
                nextBtn.disabled = false;
                nextBtn.style.display = 'block';
            } else {
                feedbackEl.style.color = "#ef4444";
                feedbackEl.innerText = `Your average score is ${finalScore}%. You need at least 80% to submit. Please click Restart Practice to try again.`;
                nextBtn.style.display = 'none';
            }
        } else {
            // Standard Navigation UI
            prevBtn.style.display = 'block';
            restartBtn.style.display = 'none';
            nextBtn.style.display = 'block';
            nextBtn.innerText = "Next";
            nextBtn.disabled = true;
            prevBtn.disabled = phaseIndex === 0;

            if (currentPhase.mode === 'notes') {
                nextBtn.disabled = false;
            } else {
                reportProgress({ currentPhase: phaseIndex, status: 'started' });
            }
        }

        draw();
    }

    function getRefractedAngleGen(n1, n2, rayTravelAngle, normalAngleIntoMedium1) {
        let fromIncAngle = rayTravelAngle + Math.PI; 
        let theta1 = fromIncAngle - normalAngleIntoMedium1;
        
        while (theta1 > Math.PI) theta1 -= Math.PI * 2;
        while (theta1 < -Math.PI) theta1 += Math.PI * 2;

        const sinTheta2 = (n1 / n2) * Math.sin(theta1);
        
        if (Math.abs(sinTheta2) > 1) {
            // Total Internal Reflection
            return normalAngleIntoMedium1 - theta1; 
        }
        
        const theta2 = Math.asin(sinTheta2);
        return normalAngleIntoMedium1 + Math.PI + theta2;
    }

    function findExitPoint(lens, entryPt, travelAngle) {
        const dir = { x: Math.cos(travelAngle), y: Math.sin(travelAngle) };
        let closest = null;

        if (lens.type === 'circle') {
            const ocX = entryPt.x - lens.x;
            const ocY = entryPt.y - lens.y;
            const a = 1;
            const b = 2 * (ocX * dir.x + ocY * dir.y);
            const c = ocX * ocX + ocY * ocY - lens.r * lens.r;
            const disc = b * b - 4 * a * c;
            if (disc > 0) {
                const t1 = (-b - Math.sqrt(disc)) / 2;
                const t2 = (-b + Math.sqrt(disc)) / 2;
                const t = t1 > 0.05 ? t1 : (t2 > 0.05 ? t2 : -1);
                if (t > 0) {
                    const hitX = entryPt.x + dir.x * t;
                    const hitY = entryPt.y + dir.y * t;
                    closest = { x: hitX, y: hitY, normal: Math.atan2(hitY - lens.y, hitX - lens.x) };
                }
            }
        } else {
            let pts = [];
            if (lens.type === 'rect') {
                pts = [
                    {x: lens.x, y: lens.y}, {x: lens.x + lens.w, y: lens.y},
                    {x: lens.x + lens.w, y: lens.y + lens.h}, {x: lens.x, y: lens.y + lens.h}
                ];
            } else if (lens.type === 'polygon') {
                pts = lens.points;
            }

            for(let i=0; i<pts.length; i++) {
                const p1 = pts[i];
                const p2 = pts[(i+1)%pts.length];
                const v1 = entryPt.x - p1.x;
                const v2 = entryPt.y - p1.y;
                const v3 = p2.x - p1.x;
                const v4 = p2.y - p1.y;
                const cross = dir.x * v4 - dir.y * v3;
                if (Math.abs(cross) < 0.001) continue;

                const t1 = (v3 * v2 - v4 * v1) / cross;
                const t2 = (dir.x * v2 - dir.y * v1) / cross;

                if (t1 > 0.05 && t2 >= 0 && t2 <= 1) {
                    if (!closest || t1 < closest.t) {
                        closest = {
                            x: entryPt.x + dir.x * t1,
                            y: entryPt.y + dir.y * t1,
                            t: t1,
                            normal: Math.atan2(p2.y - p1.y, p2.x - p1.x) - Math.PI/2
                        };
                    }
                }
            }
        }
        return closest;
    }

    function buildLensPath(lens) {
        ctx.beginPath();
        if (lens.type === 'line') {
            ctx.moveTo(lens.x1, lens.y1);
            ctx.lineTo(lens.x2, lens.y2);
        } else if (lens.type === 'rect') {
            ctx.rect(lens.x, lens.y, lens.w, lens.h);
        } else if (lens.type === 'circle') {
            ctx.arc(lens.x, lens.y, lens.r, 0, Math.PI * 2);
        } else if (lens.type === 'polygon') {
            ctx.moveTo(lens.points[0].x, lens.points[0].y);
            for (let i = 1; i < lens.points.length; i++) {
                ctx.lineTo(lens.points[i].x, lens.points[i].y);
            }
            ctx.closePath();
        }
    }

    function drawArrow(fromX, fromY, toX, toY, color) {
        const headlen = 12; 
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.lineTo(toX, toY);
        ctx.fillStyle = color;
        ctx.fill();
    }

    function drawRightAngle(x, y, angle) {
        const size = 15;
        const surfaceAngle = angle + Math.PI / 2;
        
        // Point along the normal
        const nx = x + Math.cos(angle) * size;
        const ny = y + Math.sin(angle) * size;
        
        // Point along the surface
        const sx = x + Math.cos(surfaceAngle) * size;
        const sy = y + Math.sin(surfaceAngle) * size;
        
        // Corner point
        const cx = nx + Math.cos(surfaceAngle) * size;
        const cy = ny + Math.sin(surfaceAngle) * size;
        
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(cx, cy);
        ctx.lineTo(nx, ny);
        ctx.strokeStyle = "rgba(16, 185, 129, 0.9)";
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawNormalLine(x, y, angle, color, label) {
        const length = 200; 
        const x1 = x + Math.cos(angle) * length;
        const y1 = y + Math.sin(angle) * length;
        const x2 = x - Math.cos(angle) * length;
        const y2 = y - Math.sin(angle) * length;
        
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 4]);
        ctx.stroke();
        ctx.setLineDash([]); 

        if (label) {
            ctx.fillStyle = color;
            ctx.font = "bold 14px Arial";
            ctx.fillText(label, x + Math.cos(angle)*80, y + Math.sin(angle)*80 - 5);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (!currentPhase || !currentPhase.lens) return;
        const p = currentPhase;
        
        // Use explicitly set incidence point for basic line examples, else extract from ray
        const inc = p.incPoint ? { x: p.incPoint.x, y: p.incPoint.y } : (p.ray ? { x: p.ray.endX, y: p.ray.endY } : null);

        // 1. Draw Lens or Line Surface
        if (p.lens.type === 'line') {
            ctx.strokeStyle = "#1e293b"; // Dark slate
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            buildLensPath(p.lens);
            ctx.stroke();
            ctx.lineCap = 'butt'; // reset
        } else {
            ctx.fillStyle = "rgba(56, 189, 248, 0.2)"; 
            ctx.strokeStyle = "#0284c7";
            ctx.lineWidth = 3;
            buildLensPath(p.lens);
            ctx.fill();
            ctx.stroke();
        }

        // Draw Circle Center
        if (p.lens.type === 'circle') {
            ctx.beginPath();
            ctx.fillStyle = "#0369a1";
            ctx.arc(p.lens.x, p.lens.y, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillText("Center", p.lens.x - 18, p.lens.y + 18);
        }

        // 2 & 3. Draw Rays (Incident, Interior, Exit) -> Only if a ray exists
        if (p.ray) {
            // Incident Ray
            drawArrow(p.ray.startX, p.ray.startY, p.ray.endX, p.ray.endY, "#eab308"); 
            
            if (inc && showTrueNormal) {
                const n1 = 1.0, n2 = 1.5;
                const entryTravelAngle = Math.atan2(p.ray.endY - p.ray.startY, p.ray.endX - p.ray.startX);
                
                // First Refraction (Air -> Lens)
                const interiorAngle = getRefractedAngleGen(n1, n2, entryTravelAngle, p.correctAngle);
                
                // Find Exit Point
                const exitHit = findExitPoint(p.lens, inc, interiorAngle);
                
                if (exitHit) {
                    // Draw interior ray
                    drawArrow(inc.x, inc.y, exitHit.x, exitHit.y, "#d97706"); // Darker orange inside
                    
                    // Second Refraction (Lens -> Air)
                    const normalIntoLens = exitHit.normal + Math.PI;
                    const exitAngle = getRefractedAngleGen(n2, n1, interiorAngle, normalIntoLens);
                    
                    // Draw exit ray
                    const exitLen = 120;
                    const finalX = exitHit.x + Math.cos(exitAngle) * exitLen;
                    const finalY = exitHit.y + Math.sin(exitAngle) * exitLen;
                    drawArrow(exitHit.x, exitHit.y, finalX, finalY, "#fbbf24"); // Amber outside
                    
                } else {
                    // Fallback (failsafe)
                    const refLen = 200;
                    const rx = inc.x + Math.cos(interiorAngle) * refLen;
                    const ry = inc.y + Math.sin(interiorAngle) * refLen;
                    ctx.save();
                    buildLensPath(p.lens);
                    ctx.clip();
                    drawArrow(inc.x, inc.y, rx, ry, "#d97706"); 
                    ctx.restore();
                }
            }
        }

        // 4. Draw True Normal & Right Angle indicator
        if (showTrueNormal) {
            drawNormalLine(inc.x, inc.y, p.correctAngle, "rgba(16, 185, 129, 0.6)", p.mode === 'learn' ? "Normal Line" : "True Normal");
            drawRightAngle(inc.x, inc.y, p.correctAngle);
        }

        // 5. Draw User's Line
        if (p.mode === 'practice') {
            if (isDrawing) {
                ctx.beginPath();
                ctx.moveTo(drawStartX, drawStartY);
                ctx.lineTo(currentX, currentY);
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 3;
                ctx.stroke();
            } else if (userDrawnLine) {
                const dx = userDrawnLine.x2 - userDrawnLine.x1;
                const dy = userDrawnLine.y2 - userDrawnLine.y1;
                const angle = Math.atan2(dy, dx);
                
                const midX = inc.x; 
                const midY = inc.y;
                ctx.beginPath();
                ctx.moveTo(midX + Math.cos(angle)*200, midY + Math.sin(angle)*200);
                ctx.lineTo(midX - Math.cos(angle)*200, midY - Math.sin(angle)*200);
                ctx.strokeStyle = "#f97316";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // 6. Draw Point of Incidence (on top of lines)
        if (inc) {
            ctx.beginPath();
            ctx.arc(inc.x, inc.y, 5, 0, Math.PI*2);
            ctx.fillStyle = "#ef4444"; 
            ctx.fill();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    // --- 4. INTERACTION HANDLING ---
    function getMousePos(evt) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let cx = evt.clientX;
        let cy = evt.clientY;

        if (evt.touches && evt.touches.length > 0) {
            cx = evt.touches[0].clientX;
            cy = evt.touches[0].clientY;
        }
        return { x: (cx - rect.left) * scaleX, y: (cy - rect.top) * scaleY };
    }

    function handleStart(e) {
        if (!currentPhase) return;
        if (currentPhase.mode === 'notes' || currentPhase.mode === 'complete') return;
        
        e.preventDefault();
        const pos = getMousePos(e);

        if (currentPhase.mode === 'learn') {
            showTrueNormal = true;
            nextBtn.disabled = false;
            draw();
        } 
        else if (currentPhase.mode === 'practice' && nextBtn.disabled) {
            isDrawing = true;
            drawStartX = pos.x;
            drawStartY = pos.y;
            currentX = pos.x;
            currentY = pos.y;
            feedbackEl.innerText = "Dragging line...";
            feedbackEl.style.color = "#64748b";
            draw();
        }
    }

    function handleMove(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getMousePos(e);
        currentX = pos.x;
        currentY = pos.y;
        draw();
    }

    function handleEnd(e) {
        if (!isDrawing) return;
        e.preventDefault();
        isDrawing = false;
        
        const lineLen = Math.hypot(currentX - drawStartX, currentY - drawStartY);
        if (lineLen < 10) {
            feedbackEl.innerText = "Please drag your mouse to draw a line segment.";
            feedbackEl.style.color = "#ef4444";
            draw();
            return;
        }

        userDrawnLine = { x1: drawStartX, y1: drawStartY, x2: currentX, y2: currentY };
        const inc = currentPhase.incPoint ? { x: currentPhase.incPoint.x, y: currentPhase.incPoint.y } : { x: currentPhase.ray.endX, y: currentPhase.ray.endY };
        
        // 1. Distance check (must pass through incidence point)
        const A = currentY - drawStartY;
        const B = -(currentX - drawStartX);
        const C = currentX * drawStartY - drawStartX * currentY;
        const dist = Math.abs(A * inc.x + B * inc.y + C) / Math.hypot(A, B);

        let accuracy = 0;
        let isSuccess = false;

        if (dist > 15) {
            // Missed the red dot entirely
            feedbackEl.style.color = "#ef4444";
            feedbackEl.innerText = `Score 0%. Your line missed the red dot by ${Math.round(dist)}px! It MUST pass exactly through the Point of Incidence.`;
            userDrawnLine = null; // Don't keep drawing the bad line
            accuracy = 0;
        } else {
            // 2. Angle check
            const drawnAngle = Math.atan2(A, -B); 
            let angleDiff = Math.abs(drawnAngle - currentPhase.correctAngle);
            
            // Normalize to 0..PI
            angleDiff = angleDiff % Math.PI;
            if (angleDiff > Math.PI / 2) angleDiff = Math.PI - angleDiff;
            
            const diffDeg = angleDiff * 180 / Math.PI;
            
            // Stricter Scoring Math: 
            // 0-2 degrees off = 100%. Drops by ~5% for every degree after that. 22 degrees off = 0%.
            if (diffDeg <= 2) {
                accuracy = 100;
            } else {
                accuracy = Math.max(0, 100 - ((diffDeg - 2) / 20) * 100);
            }
            
            accuracy = Math.round(accuracy);

            if (accuracy >= 85) {
                feedbackEl.style.color = "#10b981";
                if (currentPhase.ray) {
                    feedbackEl.innerText = `Awesome! ${accuracy}% accurate. Notice how the light bends TOWARDS the normal inside, and AWAY as it exits!`;
                } else {
                    feedbackEl.innerText = `Awesome! ${accuracy}% accurate. You've drawn a perfect perpendicular right angle!`;
                }
                showTrueNormal = true;
                nextBtn.disabled = false;
                isSuccess = true;
            } else {
                feedbackEl.style.color = "#ef4444";
                feedbackEl.innerText = `Not quite right (${accuracy}%). You were off by ${Math.round(diffDeg)}°. Try again! (Needs 85%+)`;
                userDrawnLine = null; // Erase line to force retry
            }
        }

        totalAttempts++;
        totalAccuracy += accuracy;
        currentScore = Math.round(totalAccuracy / totalAttempts);
        scoreDisplay.innerText = `Practice Score: ${currentScore}%`;

        reportProgress({ 
            currentPhase: phaseIndex, 
            accuracyThisAttempt: accuracy,
            averageScore: currentScore,
            status: isSuccess ? 'success' : 'retry'
        });

        draw();
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    canvas.addEventListener('touchmove', handleMove, {passive: false});
    canvas.addEventListener('touchend', handleEnd);

    // Navigation and Submission Logic
    nextBtn.addEventListener('click', () => {
        if (currentPhase.mode === 'complete') {
            // Show custom modal if clicking submit
            document.getElementById('modalScoreDisplay').innerText = currentScore;
            document.getElementById('modalOverlay').style.display = 'flex';
        } else {
            phaseIndex++;
            initPhase();
        }
    });

    prevBtn.addEventListener('click', () => {
        phaseIndex = Math.max(0, phaseIndex - 1);
        initPhase();
    });

    restartBtn.addEventListener('click', () => {
        phasesConfig = [];
        phaseIndex = 0;
        totalAttempts = 0;
        totalAccuracy = 0;
        currentScore = 0;
        isSubmitted = false;
        scoreDisplay.innerText = `Practice Score: 0%`;
        initPhase();
    });

    // Modal Events
    document.getElementById('modalCancelBtn').addEventListener('click', () => {
        document.getElementById('modalOverlay').style.display = 'none';
    });

    document.getElementById('modalSubmitBtn').addEventListener('click', () => {
        document.getElementById('modalOverlay').style.display = 'none';
        isSubmitted = true;
        reportComplete({ phase: 'complete', score: currentScore });
        initPhase(); // Refresh UI to show success state
    });

    // Start Simulation
    initPhase();

</script>
</body>
</html>
